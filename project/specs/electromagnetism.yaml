# ЭЛЕКТРОМАГНЕТИЗМ
# Сила Лоренца, сила Ампера, электромагнитная индукция

templates:
  - id: lorentz_force
    name: "Сила Лоренца"
    category: "Электромагнетизм"
    icon: "🧲"
    description: "F = q·v·B·sin(α) — сила, действующая на заряженную частицу в магнитном поле"
    variables:
      q: { label: "Заряд q", unit: "Кл", type: float }
      v: { label: "Скорость v", unit: "м/с", type: float }
      B: { label: "Индукция магнитного поля B", unit: "Тл", type: float }
      alpha: { label: "Угол α между v и B", unit: "°", type: float }
      F: { label: "Сила Лоренца F", unit: "Н", type: float }
    solutions:
      - id: F_from_qvB
        target: F
        label: "Силу Лоренца F"
        requires: [q, v, B, alpha]
        formula: "q * v * B * sin(alpha)"
        steps:
          - "Формула: F = q·v·B·sin(α)"
          - "F = {q}·{v}·{B}·sin({alpha}°) = {result:.3e} Н"
      - id: B_from_Fqv
        target: B
        label: "Индукцию B"
        requires: [F, q, v, alpha]
        formula: "F / (q * v * sin(alpha))"
        steps:
          - "Из F = q·v·B·sin(α): B = F/(q·v·sin(α))"
          - "B = {F} / ({q}·{v}·sin({alpha}°)) = {result:.3e} Тл"
    explanation: "Сила Лоренца: F = qvB·sin(α)."

  - id: ampere_force
    name: "Сила Ампера"
    category: "Электромагнетизм"
    icon: "⚡"
    description: "F = I·B·L·sin(α) — сила, действующая на проводник с током в магнитном поле"
    variables:
      I: { label: "Сила тока I", unit: "А", type: float }
      B: { label: "Индукция магнитного поля B", unit: "Тл", type: float }
      L: { label: "Длина проводника L", unit: "м", type: float }
      alpha: { label: "Угол α между I и B", unit: "°", type: float }
      F: { label: "Сила Ампера F", unit: "Н", type: float }
    solutions:
      - id: F_from_IBL
        target: F
        label: "Силу Ампера F"
        requires: [I, B, L, alpha]
        formula: "I * B * L * sin(alpha)"
        steps:
          - "Формула: F = I·B·L·sin(α)"
          - "F = {I}·{B}·{L}·sin({alpha}°) = {result:.3f} Н"
      - id: B_from_FIL
        target: B
        label: "Индукцию B"
        requires: [F, I, L, alpha]
        formula: "F / (I * L * sin(alpha))"
        steps:
          - "Из F = I·B·L·sin(α): B = F/(I·L·sin(α))"
          - "B = {F} / ({I}·{L}·sin({alpha}°)) = {result:.3f} Тл"
    explanation: "Сила Ампера: F = IBL·sin(α)."

  - id: electromagnetic_induction
    name: "Электромагнитная индукция (закон Фарадея)"
    category: "Электромагнетизм"
    icon: "🔋"
    description: "ε = -ΔΦ/Δt — закон электромагнитной индукции"
    variables:
      phi1: { label: "Начальный магнитный поток Φ₁", unit: "Вб", type: float }
      phi2: { label: "Конечный магнитный поток Φ₂", unit: "Вб", type: float }
      dt: { label: "Время изменения Δt", unit: "с", type: float }
      epsilon: { label: "ЭДС индукции ε", unit: "В", type: float }
    solutions:
      - id: epsilon_from_phi_dt
        target: epsilon
        label: "ЭДС индукции ε"
        requires: [phi1, phi2, dt]
        formula: "abs(phi2 - phi1) / dt"
        steps:
          - "Закон Фарадея: |ε| = |ΔΦ|/Δt"
          - "ΔΦ = |{phi2} - {phi1}| = {delta_phi:.3f} Вб"
          - "ε = {delta_phi:.3f} / {dt} = {result:.3f} В"
      - id: dt_from_phi_epsilon
        target: dt
        label: "Время Δt"
        requires: [phi1, phi2, epsilon]
        formula: "abs(phi2 - phi1) / epsilon"
        steps:
          - "Из |ε| = |ΔΦ|/Δt: Δt = |ΔΦ|/|ε|"
          - "Δt = {delta_phi:.3f} / {epsilon} = {result:.3f} с"
    explanation: "Закон Фарадея: ЭДС индукции пропорциональна скорости изменения магнитного потока."

  - id: inductance
    name: "Энергия магнитного поля"
    category: "Электромагнетизм"
    icon: "🧲"
    description: "W = L·I²/2 — энергия магнитного поля катушки"
    variables:
      L: { label: "Индуктивность L", unit: "Гн", type: float }
      I: { label: "Сила тока I", unit: "А", type: float }
      W: { label: "Энергия W", unit: "Дж", type: float }
    solutions:
      - id: W_from_LI
        target: W
        label: "Энергию W"
        requires: [L, I]
        formula: "L * I * I / 2"
        steps:
          - "Формула: W = L·I²/2"
          - "W = {L}·{I}²/2 = {result:.3f} Дж"
      - id: L_from_WI
        target: L
        label: "Индуктивность L"
        requires: [W, I]
        formula: "2 * W / (I * I)"
        steps:
          - "Из W = L·I²/2: L = 2W/I²"
          - "L = 2·{W} / {I}² = {result:.3f} Гн"
    explanation: "Энергия магнитного поля: W = LI²/2."
