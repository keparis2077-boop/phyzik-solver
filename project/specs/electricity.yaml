# ============================================================
# ЭЛЕКТРИЧЕСТВО — 8-9 КЛАСС
# Закон Ома, последовательное/параллельное соединение, мощность
# ============================================================

templates:
  - id: ohm_law
    name: "Закон Ома для участка цепи"
    category: "Электричество"
    icon: "⚡"
    description: "I = U / R"
    variables:
      U: { label: "Напряжение U", unit: "В", type: float }
      I: { label: "Сила тока I", unit: "А", type: float }
      R: { label: "Сопротивление R", unit: "Ом", type: float }
    solutions:
      - id: I_from_UR
        target: I
        label: "Силу тока I"
        requires: [U, R]
        formula: "U / R"
        steps:
          - "Формула: I = U/R"
          - "I = {U}/{R} = {result:.3f} А"
      - id: U_from_IR
        target: U
        label: "Напряжение U"
        requires: [I, R]
        formula: "I * R"
        steps:
          - "Из I = U/R: U = I·R"
          - "U = {I}·{R} = {result:.2f} В"
      - id: R_from_UI
        target: R
        label: "Сопротивление R"
        requires: [U, I]
        formula: "U / I"
        steps:
          - "Из I = U/R: R = U/I"
          - "R = {U}/{I} = {result:.2f} Ом"
    explanation: "Закон Ома: сила тока прямо пропорциональна напряжению и обратно пропорциональна сопротивлению."

  - id: series_circuit
    name: "Последовательное соединение"
    category: "Электричество"
    icon: "🔗"
    description: "R = R₁ + R₂, I = I₁ = I₂, U = U₁ + U₂"
    variables:
      R1: { label: "Сопротивление R₁", unit: "Ом", type: float }
      R2: { label: "Сопротивление R₂", unit: "Ом", type: float }
      U: { label: "Общее напряжение U", unit: "В", type: float }
      I: { label: "Сила тока I", unit: "А", type: float }
    solutions:
      - id: Rtotal_from_R1R2
        target: R_total
        label: "Общее сопротивление R"
        requires: [R1, R2]
        formula: "R1 + R2"
        steps:
          - "Формула: R = R₁ + R₂"
          - "R = {R1} + {R2} = {result:.2f} Ом"
      - id: U1_from_IR1
        target: U1
        label: "Напряжение U₁"
        requires: [I, R1]
        formula: "I * R1"
        steps:
          - "Из закона Ома: U₁ = I·R₁"
          - "U₁ = {I}·{R1} = {result:.2f} В"
    explanation: "При последовательном соединении: R = R₁ + R₂, I = const."

  - id: parallel_circuit
    name: "Параллельное соединение"
    category: "Электричество"
    icon: "🔀"
    description: "1/R = 1/R₁ + 1/R₂"
    variables:
      R1: { label: "Сопротивление R₁", unit: "Ом", type: float }
      R2: { label: "Сопротивление R₂", unit: "Ом", type: float }
      U: { label: "Напряжение U", unit: "В", type: float }
    solutions:
      - id: Rtotal_parallel
        target: R_total
        label: "Общее сопротивление R"
        requires: [R1, R2]
        formula: "R1 * R2 / (R1 + R2)"
        steps:
          - "Формула: R = (R₁·R₂)/(R₁ + R₂)"
          - "R = ({R1}·{R2})/({R1}+{R2}) = {result:.2f} Ом"
      - id: I1_from_UR1
        target: I1
        label: "Силу тока I₁"
        requires: [U, R1]
        formula: "U / R1"
        steps:
          - "Из закона Ома: I₁ = U/R₁"
          - "I₁ = {U}/{R1} = {result:.3f} А"
    explanation: "При параллельном соединении: 1/R = 1/R₁ + 1/R₂, U = const."

  - id: electrical_power
    name: "Электрическая мощность"
    category: "Электричество"
    icon: "💡"
    description: "P = U·I, P = I²·R, P = U²/R"
    variables:
      U: { label: "Напряжение U", unit: "В", type: float }
      I: { label: "Сила тока I", unit: "А", type: float }
      R: { label: "Сопротивление R", unit: "Ом", type: float }
      P: { label: "Мощность P", unit: "Вт", type: float }
      A: { label: "Работа A", unit: "Дж", type: float }
      t: { label: "Время t", unit: "с", type: float }
    solutions:
      - id: P_from_UI
        target: P
        label: "Мощность P"
        requires: [U, I]
        formula: "U * I"
        steps:
          - "Формула: P = U·I"
          - "P = {U}·{I} = {result:.2f} Вт"
      - id: A_from_Pt
        target: A
        label: "Работу A"
        requires: [P, t]
        formula: "P * t"
        steps:
          - "Из P = A/t: A = P·t"
          - "A = {P}·{t} = {result:.2f} Дж"
    explanation: "Мощность электрического тока: P = U·I = I²·R = U²/R."
