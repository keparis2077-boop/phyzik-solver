# ============================================================
# МОЛЕКУЛЯРНАЯ ФИЗИКА — 10 КЛАСС
# Уравнение Менделеева-Клапейрона, влажность, фазовые переходы
# ============================================================

templates:
  - id: ideal_gas
    name: "Уравнение Менделеева-Клапейрона"
    category: "Молекулярная физика"
    icon: "🫧"
    description: "pV = nRT = (m/M)RT"
    variables:
      p: { label: "Давление p", unit: "Па", type: float }
      V: { label: "Объём V", unit: "м³", type: float }
      T: { label: "Температура T", unit: "К", type: float }
      n: { label: "Количество вещества n", unit: "моль", type: float }
      m: { label: "Масса m", unit: "кг", type: float }
      M: { label: "Молярная масса M", unit: "кг/моль", type: float }
    solutions:
      - id: p_from_nRT
        target: p
        label: "Давление p"
        requires: [n, T, V]
        formula: "n * 8.31 * T / V"
        steps:
          - "Формула: pV = nRT"
          - "p = nRT/V = {n}·8.31·{T}/{V} = {result:.2f} Па"
      - id: T_from_pV
        target: T
        label: "Температуру T"
        requires: [p, V, n]
        formula: "p * V / (n * 8.31)"
        steps:
          - "Из pV = nRT: T = pV/(nR)"
          - "T = {p}·{V}/({n}·8.31) = {result:.2f} К"
      - id: V_from_nRT
        target: V
        label: "Объём V"
        requires: [n, T, p]
        formula: "n * 8.31 * T / p"
        steps:
          - "Из pV = nRT: V = nRT/p"
          - "V = {n}·8.31·{T}/{p} = {result:.4f} м³"
    explanation: "Уравнение состояния идеального газа: pV = nRT."

  - id: humidity
    name: "Влажность воздуха"
    category: "Молекулярная физика"
    icon: "💧"
    description: "φ = p/p₀·100%"
    variables:
      p: { label: "Давление пара p", unit: "Па", type: float }
      p0: { label: "Давление насыщения p₀", unit: "Па", type: float }
      phi: { label: "Влажность φ", unit: "%", type: float }
    solutions:
      - id: phi_from_p
        target: phi
        label: "Влажность φ"
        requires: [p, p0]
        formula: "p / p0 * 100"
        steps:
          - "Формула: φ = p/p₀·100%"
          - "φ = {p}/{p0}·100% = {result:.1f}%"
      - id: p_from_phi
        target: p
        label: "Давление пара p"
        requires: [phi, p0]
        formula: "phi * p0 / 100"
        steps:
          - "Из φ = p/p₀·100%: p = φ·p₀/100"
          - "p = {phi}·{p0}/100 = {result:.2f} Па"
    explanation: "Относительная влажность: φ = p/p₀·100%."
