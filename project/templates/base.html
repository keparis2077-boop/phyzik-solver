<!doctype html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Решебник задач{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- MathJax для формул -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<header>
    <div class="header-inner">
        <a href="{{ url_for('index') }}" class="logo">📚 Решебник задач</a>
        <nav>
            <a href="{{ url_for('index') }}">Задачи</a>
            <a href="{{ url_for('reference') }}">Справочник</a>
            <a href="{{ url_for('history') }}">История</a>
            <button id="theme-toggle" title="Сменить тему">🌙</button>
        </nav>
    </div>
</header>

<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<footer>© Учебный проект на Flask</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
